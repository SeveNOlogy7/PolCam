name: CI

on:
  push:
    branches: [main, dev, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# 同一分支的新提交取消仍在跑的旧任务，省 runner 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    env:
      # 无头运行 Qt 测试。测试只断言控件状态，不断言渲染结果，
      # 所以 offscreen 足够；注意它不能用于中文视觉截图取证。
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      # setup-uv 从 v8 起不再发布裸 major tag（v8/v9/v10 都不存在），
      # 所以这里必须钉完整版本号，不能写成 @v10。
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Sync dependencies from uv.lock
        run: uv sync --frozen

      - name: Run test suite
        # 每个测试文件单独起一个进程，避免未释放的 Qt 对象在同一次运行里攒到
        # 触发 0xc0000374。详见 tools/run_tests.py。
        run: uv run python tools/run_tests.py -q
